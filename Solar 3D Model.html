<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太阳系运动模拟</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container"></div>
    
    <!-- 隐藏控制面板按钮 -->
    <button id="toggle-panel-btn" class="toggle-panel-btn">👁️ 隐藏面板</button>
    
    <!-- 科普介绍卡片 -->
    <div id="planet-card" class="planet-card hidden" onclick="event.stopPropagation()">
        <h2 id="planet-card-title">星球名称</h2>
        <div class="card-content">
            <p id="planet-card-desc">星球的科普介绍将会显示在这里...</p>
        </div>
        <ul id="planet-card-params" class="card-params">
            <!-- 动态生成的参数将插入这里 -->
        </ul>
        <div id="planet-card-distance" class="card-distance hidden">
            <!-- 暂停时动态显示的实距 -->
        </div>
        <button id="close-card-btn" class="close-card-btn">关闭 (或再次点击空白)</button>
    </div>
    
    <!-- 控制面板 -->
    <div id="control-panel">
        <h2>太阳系模拟控制</h2>
        
        <div class="control-group">
            <label>当前时间：</label>
            <div id="current-time" class="time-display">--:--:--</div>
            <div id="current-date" class="date-display">----/--/--</div>
        </div>
        
        <div class="control-group">
            <label>设置日期：</label>
            <input type="datetime-local" id="date-picker" class="date-input">
            <button id="set-date-btn" class="btn">跳转到日期</button>
        </div>
        
        <div class="control-group">
            <label>时间控制：</label>
            <button id="play-pause-btn" class="btn btn-primary">暂停</button>
            <button id="reset-btn" class="btn">重置到当前时间</button>
        </div>
        
        <div class="control-group">
            <label>倍速：</label>
            <div class="speed-controls">
                <button class="btn speed-btn" data-speed="1">1x</button>
                <button class="btn speed-btn active" data-speed="10">10x</button>
                <button class="btn speed-btn" data-speed="100">100x</button>
                <button class="btn speed-btn" data-speed="1000">1000x</button>
            </div>
            <div class="speed-input-group">
                <input type="number" id="custom-speed" min="1" max="1000" value="10" class="speed-input">
                <span class="speed-label">倍速</span>
            </div>
        </div>
        
        <div class="control-group">
            <label>显示选项：</label>
            <label class="checkbox-label">
                <input type="checkbox" id="show-orbits" checked> 显示轨道
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="show-labels" checked> 显示标签
            </label>
        </div>
        
        <div class="control-group">
            <button id="reset-view-btn" class="btn">重置视角</button>
        </div>

        <div class="control-group">
            <label>动画导出（优先 MP4）：</label>
            <div class="record-actions">
                <button type="button" id="record-start-btn" class="btn btn-record">开始录制</button>
                <button type="button" id="record-stop-btn" class="btn btn-record-stop" disabled>停止并保存</button>
            </div>
            <div id="record-status" class="record-status">未录制</div>
        </div>
        
        <div class="info-panel">
            <div id="planet-info">鼠标悬停在行星上查看信息</div>
        </div>
    </div>
    
    <!-- 加载提示 -->
    <div id="loading">加载中...</div>
    
    <!-- 引入Three.js库 -->
    <script src="js/three.min.js"></script>
    <script src="js/OrbitControls.js"></script>
    
    <!-- 引入项目脚本 -->
    <script src="js/texturesBase64.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/planet.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/solarSystem.js"></script>
    <script src="js/recorder.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
